[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sensors",
    "crates/ipc",
    "crates/ui",
    "crates/helper",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["core-pulse"]

[workspace.dependencies]
core-pulse-core = { path = "crates/core" }
core-pulse-sensors = { path = "crates/sensors" }
core-pulse-ipc = { path = "crates/ipc" }

anyhow = "1.0"
arc-swap = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"